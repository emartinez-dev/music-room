name: PR CI

# Cloud-only validation for PRs targeting the main branch.
# No local hooks are involved — pushes to feature/*, develop, etc. are never touched by this file.
on:
  pull_request:
    branches: [master, main]
    types: [opened, reopened, synchronize]

# Cancel superseded runs when a PR is updated again before CI finishes.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: music-room
          POSTGRES_USER: music-room
          POSTGRES_PASSWORD: music-room
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U music-room"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: music-room
      POSTGRES_USER: music-room
      POSTGRES_PASSWORD: music-room
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: apps/api
        run: python -m pytest --cov=music_room --cov=authentication --cov-report=term-missing

  mobile-tests:
    name: Mobile tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/mobile
        run: npm test -- --ci

  # Single job to set as the required status check in branch protection —
  # it aggregates both suites so only one check needs to be selected.
  ci-status:
    name: CI Passed
    if: always()
    needs: [api-tests, mobile-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
