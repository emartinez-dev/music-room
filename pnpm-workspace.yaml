  - expo-modules-core@56.0.15
  - expo-modules-jsi@56.0.8
  - expo-server@56.0.5
  - expo@56.0.9
  - '@expo/metro-runtime@56.0.14'
  - '@expo/ui@56.0.16'
  - expo-router@56.2.9
  - expo-symbols@56.0.6
  - expo-dev-client@56.0.19
  - expo-dev-launcher@56.0.19
nodeLinker: hoisted
